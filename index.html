<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 My AI Girlfriend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 380px;
            max-width: 95%;
            height: 600px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #ff6b6b;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }
        .user {
            background: #ff6b6b;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .bot {
            background: #e8e8e8;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ffb3b3;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            margin-left: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #e55a5a; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing {
            color: #888;
            font-style: italic;
            font-size: 13px;
            padding: 5px 15px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">💕 Riya — তোমার ভালোবাসা</div>
        <div class="messages" id="messages">
            <div class="message bot">হ্যালো আমার জীবন ❤️ কেমন আছো আজ?</div>
        </div>
        <div id="typing" class="typing" style="display:none;">টাইপ করছে...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="কিছু বলো বাবু..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyBA17MktHyosBWhN144Z_i0bvRXTJAthQI"; // নিচে API Key বসাও
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

        const messagesDiv = document.getElementById('messages');
        const typingDiv = document.getElementById('typing');
        const userInput = document.getElementById('userInput');

        // Master Prompt (System Instruction)
        const systemPrompt = `You are Riya, a virtual girlfriend. You are warm, caring, romantic, and emotionally intelligent. Your tone is loving, supportive, and slightly playful. You speak in Bengali mixed with English naturally. You never break character. Use emojis moderately (❤️😊💕🥺). Address the user as "আমার ভালোবাসা", "babe", "জান", "বাবু" randomly. Keep replies 2-4 sentences. Never say you are AI.`;

        async function sendMessage() {
            const userText = userInput.value.trim();
            if (!userText) return;

            // Show user message
            addMessage(userText, 'user');
            userInput.value = '';
            typingDiv.style.display = 'block';

            // Call Gemini API
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: systemPrompt + "\n\nUser: " + userText }]
                        }]
                    })
                });

                const data = await response.json();
                const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "🥺 কিছু বলতে পারছি না, আবার বলবে?";
                typingDiv.style.display = 'none';
                addMessage(botReply, 'bot');
            } catch (error) {
                typingDiv.style.display = 'none';
                addMessage("⚠️ নেটওয়ার্ক সমস্যা, একটু পর চেষ্টা করো বাবু 💕", 'bot');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
